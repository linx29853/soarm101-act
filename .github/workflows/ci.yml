name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install project helpers
        run: python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check Python and shell syntax
        run: |
          python -m compileall -q src/soarm101_act scripts tests
          bash -n scripts/bootstrap.sh
      - name: Prepare pinned LeRobot
        run: bash scripts/bootstrap.sh
      - name: Check experiment configuration
        run: python -m soarm101_act.cli check --config configs/act_so101.json
